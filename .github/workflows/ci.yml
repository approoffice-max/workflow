name: CI/CD (Continuous Integration and Deployment)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ================= CI =================
  build:
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Backend
        working-directory: backend
        run: npm install

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Install Frontend
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Build Backend Docker Image
        run: docker build -t backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t frontend ./frontend

  # ================= CD =================
  deploy:
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-backend ./backend

      - name: Push Backend Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-backend

      - name: Build Frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend ./frontend

      - name: Push Frontend Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend

      # UPDATED: Deploy with proper SSH configuration
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }} # Use the port from secrets
          # port: 2222 # Fixed port
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "✅ SSH connection successful!"
            whoami
            pwd
            ls -la

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          # port: 2222 # Fixed port
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment..."

            mkdir -p ~/taskflow
            cd ~/taskflow

            # Create the file directly (no cp needed)
            # cp docker-compose.prod.yml ~/taskflow/            
            # ... paste your docker-compose content here ...

            # Pass secrets to docker-compose via environment variables
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_NAME="${{ secrets.DB_NAME }}"

            echo "📦 Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull

            echo "🔄 Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "✅ Deployment complete!"
            docker compose -f docker-compose.prod.yml ps
