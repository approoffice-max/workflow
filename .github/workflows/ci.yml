name: CI/CD (Continuous Integration and Deployment)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ================= CI =================

  build:
    runs-on: ubuntu-latest
    steps:
      #  CHECKOUT STEPS
      - uses: actions/checkout@v2

      #  SETUP NODE.JS STEPS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Build BACKEND
      - name: Install Backend
        working-directory: backend
        run: npm install
      - name: Build Backend
        working-directory: backend
        run: npm run build

      # BUILD FRONTEND
      - name: Install Frontend
        working-directory: frontend
        run: npm install
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # Build Backend Docker Image
      - name: Build Backend Docker Image
        run: docker build -t backend ./backend

      # Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: docker build -t frontend ./frontend

  # ================== FROM START TO TILL NOW This is Continuous Integration (CI) ===========================

  # Now we will add Continuous Deployment (CD).

  # ================= CD =================

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      #  CHECKOUT STEPS
      - uses: actions/checkout@v2

      # Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Backend Docker Image
      - name: Build Backend
        run: docker build -t username/taskflow-backend ./backend

      # Push Backend Docker Image to Docker Hub
      - name: Push Backend Docker Image
        run: docker push username/taskflow-backend

      # Build Frontend Docker Image
      - name: Build Frontend
        run: docker build -t username/taskflow-frontend ./frontend

      # Push Frontend Docker Image to Docker Hub
      - name: Push Frontend Docker Image
        run: docker push username/taskflow-frontend

      # Deploy to Production Server
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd taskflow
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

# If we just have production files not development files
# docker compose pull
# docker compose up -d
