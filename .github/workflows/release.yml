name: CD (Continuous Deployment) || Release & Deploy Pipeline
on:
  push:
    tags:
      - "v*"

  # pull_request:
  #   branches:
  #     - main

jobs:
  # ================= CD =================
  deploy:
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Copy docker-compose.prod.yml to your Ubuntu VM
      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/taskflow/"

      - name: Build Backend Docker Image
        # run: docker build -t backend ./backend
        # run: docker build \
        #   -t ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:latest \
        #   ./backend
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:${{ github.ref_name }} \
          -t ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:latest \
          ./backend

      # - name: Build Backend
      #   run: docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-backend ./backend

      - name: Push Backend Docker Image
        # run: docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-backend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-backend:latest

      # - name: Build Frontend
      #   run: docker build -t ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend ./frontend

      - name: Build Frontend Docker Image
        # run: docker build -t frontend ./frontend
        # run: docker build \
        #   -t ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:latest \
        #   ./frontend
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:${{ github.ref_name }} \
          -t ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:latest \
          ./frontend

      - name: Push Frontend Docker Image
        # run: docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/taskflow-frontend:latest

      # UPDATED: Deploy with proper SSH configuration
      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }} # Use the port from secrets
          # port: 2222 # Fixed port
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "✅ SSH connection successful!"
            whoami
            pwd
            ls -la

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          # port: 2222 # Fixed port
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment..."

            mkdir -p ~/taskflow

            # Copy docker-compose.prod.yml from the repository root
            # The repository is at /home/runner/work/workflow/workflow
            # cp /home/runner/work/workflow/workflow/docker-compose.prod.yml ~/taskflow/

            cd ~/taskflow

            # Pass secrets to docker-compose via environment variables
            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_NAME="${{ secrets.DB_NAME }}"

            echo "📦 Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull

            echo "🔄 Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "✅ Deployment complete!"
            docker compose -f docker-compose.prod.yml ps

        #     ✅ What you've done correctly
        #     1. Separate CI and CD

        #     Your project now has:

        #     .github/workflows/
        #     ├── ci.yml
        #     └── release.yml

        #     CI
        #     Pull Request
        #           │
        #           ▼
        #     Install

        #     ↓

        #     Build

        #     ↓

        #     Docker Build

        #     ↓

        #     Done

        #     CD
        #       Tag

        #       ↓

        #       Build Images

        #       ↓

        #       Push Images

        #       ↓

        #       Deploy

        # 2. Deployment only happens on releases
        # on:
        #   push:
        #     tags:
        #       - "v*"
        # Perfect.
        # That means production changes only when you intentionally create a release.
