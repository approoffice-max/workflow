      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # script_stop: true

          script: |
            set -e

            cd ~/taskflow

            NEW_VERSION="${{ github.ref_name }}"

            echo "======================================"
            echo "🚀 Starting deployment"
            echo "New version: ${NEW_VERSION}"
            echo "======================================"

            # -----------------------------------
            # Get currently deployed version
            # -----------------------------------

            if [ -f current_version ]; then
              PREVIOUS_VERSION=$(cat current_version)
            else
              echo "❌ current_version file does not exist!"
              echo "Please create it with the currently running version."
              exit 1
            fi

            echo "Previous version: ${PREVIOUS_VERSION}"

            # -----------------------------------
            # Environment variables
            # -----------------------------------

            export APP_VERSION="${NEW_VERSION}"

            export DB_USER="${{ secrets.DB_USER }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export DB_NAME="${{ secrets.DB_NAME }}"

            # -----------------------------------
            # Pull new version
            # -----------------------------------

            echo "📦 Pulling images for ${NEW_VERSION}..."

            docker compose \
              -f docker-compose.prod.yml \
              pull

            # -----------------------------------
            # Start new version
            # -----------------------------------

            echo "🔄 Starting ${NEW_VERSION}..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d

            # -----------------------------------
            # Wait for health check
            # -----------------------------------

            echo "⏳ Waiting for backend health check..."

            MAX_RETRIES=30
            RETRY=0

            while [ $RETRY -lt $MAX_RETRIES ]; do

              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                backend 2>/dev/null || echo "missing")

              echo "Backend status: ${STATUS}"

              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Backend is healthy!"
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "❌ Backend is unhealthy!"
                break
              fi

              RETRY=$((RETRY + 1))

              echo "⏳ Waiting... ${RETRY}/${MAX_RETRIES}"

              sleep 5

            done

            # -----------------------------------
            # Check final health
            # -----------------------------------

            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              backend 2>/dev/null || echo "missing")

            echo "Final backend status: ${STATUS}"

            # -----------------------------------
            # SUCCESS
            # -----------------------------------

            if [ "$STATUS" = "healthy" ]; then

              echo "======================================"
              echo "✅ Deployment successful!"
              echo "Running version: ${NEW_VERSION}"
              echo "======================================"

              echo "${NEW_VERSION}" > current_version

              docker compose \
                -f docker-compose.prod.yml \
                ps

              exit 0
            fi

            # -----------------------------------
            # FAILURE → ROLLBACK
            # -----------------------------------

            echo "======================================"
            echo "❌ Deployment failed!"
            echo "🔙 Starting rollback..."
            echo "Rollback version: ${PREVIOUS_VERSION}"
            echo "======================================"

            export APP_VERSION="${PREVIOUS_VERSION}"

            echo "📦 Pulling previous version..."

            docker compose \
              -f docker-compose.prod.yml \
              pull

            echo "🔄 Restoring ${PREVIOUS_VERSION}..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d

            echo "⏳ Waiting for rollback health check..."

            RETRY=0

            while [ $RETRY -lt $MAX_RETRIES ]; do

              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                backend 2>/dev/null || echo "missing")

              echo "Rollback backend status: ${STATUS}"

              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Rollback successful!"
                break
              fi

              RETRY=$((RETRY + 1))

              sleep 5

            done

            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              backend 2>/dev/null || echo "missing")

            if [ "$STATUS" = "healthy" ]; then

              echo "${PREVIOUS_VERSION}" > current_version

              echo "======================================"
              echo "✅ Rollback completed"
              echo "Running version: ${PREVIOUS_VERSION}"
              echo "======================================"

              docker compose \
                -f docker-compose.prod.yml \
                ps

            else

              echo "======================================"
              echo "🚨 ROLLBACK FAILED!"
              echo "Production may not be healthy!"
              echo "======================================"

              exit 1

            fi

            # Important: deployment itself failed,
            # even though rollback succeeded.
            exit 1

