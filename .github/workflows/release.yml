            #   --env-file .env \
            #   up -d --force-recreate

            # docker inspect backend --format '{{.Config.Image}}'

            # ⏳ WAIT AGAIN
            RETRY=0

            while [ $RETRY -lt $MAX_RETRIES ]; do

              STATUS=$(docker inspect \
                  --format='{{.State.Health.Status}}' \
                  backend)

              echo "Rollback status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                  break
              fi

              RETRY=$((RETRY+1))

              sleep 5

            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' backend)

            # ✅ SUCCESSFUL ROLLBACK
            if [ "$STATUS" = "healthy" ]; then

                echo "$PREVIOUS_VERSION" > current_version

                echo "======================================"
                echo "✅ Rollback Successful"
                echo "======================================"

                docker compose \
                  -f docker-compose.prod.yml \
                  --env-file .env \
                  ps

                exit 1  # Rollback succeeded, but deployment failed
            fi

            # ❌ ROLLBACK FAILED
            echo "======================================"
            echo "🚨 Rollback Failed"
            echo "======================================"

            echo "Container Image:"
            docker inspect backend --format '{{.Config.Image}}'

            echo "Backend Logs:"
            docker logs backend --tail 100

            echo "Health Logs:"
            docker inspect backend \
              --format '{{range .State.Health.Log}}{{println .Output}}{{end}}'

            exit 1

