services:
  postgres:
    image: postgres:17
    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simpledb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simpledb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # build: ./backend
    image: mianahsan/taskflow-backend:latest
    # image: mianahsan/taskflow-backend:v1.0.0
    # image: mianahsan/taskflow-backend:${APP_VERSION}

    container_name: backend

    restart: always

    ports:
      - "5001:3000"

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/simpledb"

    # depends_on:
    #   - postgres

    # means:
    # Start the backend after starting the PostgreSQL container.
    # But it does not mean:
    # Wait until PostgreSQL is actually ready.
    # We'll change it to:

    depends_on:
      postgres:
        condition: service_healthy

    # Phase 6 — Step 3: Docker Healthcheck
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # env_file:
    #   - ./backend/.env

  frontend:
    # build: ./frontend
    image: mianahsan/taskflow-frontend:latest
    # image: mianahsan/taskflow-frontend:v1.0.0
    # image: mianahsan/taskflow-frontend:${APP_VERSION}

    ports:
      - "3000:5173"

    depends_on:
      - backend

volumes:
  postgres-data:
